<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0b0d">
<meta name="color-scheme" content="dark light">
<title>Judas</title>
<link rel="stylesheet" href="/m/m.css">
<link rel="stylesheet" href="/rich.css">
<link rel="stylesheet" href="/skin.css" id="skin-link">
<link rel="stylesheet" href="/learn/learn.css">
<link rel="stylesheet" href="/cowork/cowork.css">
</head>
<body>
<div id="app">
  <header class="bar" id="bar">
    <button type="button" id="drawer-btn" class="icon-btn" aria-label="Conversations" aria-haspopup="dialog"></button>
    <div class="bar-mid" id="bar-mid"></div>
    <button type="button" id="agents-chip" class="chip" hidden></button>
    <button type="button" id="visual-chip" class="chip" hidden>Visual</button>
    <div id="ctx-meter" class="ctx-meter" hidden role="img"><span></span></div>
    <button type="button" id="menu-btn" class="icon-btn has-dot" aria-label="Menu" aria-haspopup="dialog"><span class="dot" id="dot"></span></button>
  </header>

  <div id="cw-sub" class="cw-subbar" hidden></div>
  <!-- Cowork sub-tab stage (Engineering, Design, Research, Write panes) -->
  <section id="v-cw" class="view" aria-label="Cowork view" hidden><div id="cw-stage" class="cw-stage"></div></section>
  <!-- new conversation -->
  <section id="v-home" class="view" aria-label="New conversation">
    <div class="empty">
      <span class="coin big" aria-hidden="true">Ag</span>
      <h1 id="home-title">Chat</h1>
      <p id="home-hint" class="hint"></p>
      <div id="home-sg"></div>
    </div>
    <div id="learn-home" class="lrn-home" hidden></div>
  </section>
  <!-- conversation -->
  <section id="v-sess" class="view" aria-label="Conversation" hidden>
    <div id="learn-top" hidden></div>
    <main class="scroll" id="log" aria-live="polite"></main>
    <button type="button" id="jump" class="jump" hidden aria-label="Jump to latest"></button>
  </section>
  <!-- planner -->
  <section id="v-plan" class="view" aria-label="Planner" hidden>
    <iframe id="plan-frame" title="mach12 planner"></iframe>
  </section>
  <!-- Learn: visual tutor -->
  <section id="v-vis" class="view" aria-label="Visual tutor" hidden>
    <div id="vis-msg" class="empty" hidden></div>
    <iframe id="vis-frame" title="Visual tutor" hidden></iframe>
  </section>

  <footer id="dock" class="dock">
    <div id="approvals" class="approvals" hidden></div>
    <div id="queue" class="queue" hidden></div>
    <div class="composer">
      <div id="atts" class="atts" hidden></div>
      <textarea id="input" rows="1" placeholder="Message Judas" aria-label="Message" enterkeyhint="enter" autocapitalize="sentences"></textarea>
      <div class="crow">
        <button type="button" id="attach" class="tool" aria-label="Attach a file"></button>
        <button type="button" id="folder" class="tool wide" hidden></button>
        <span class="grow"></span>
        <button type="button" id="interrupt" class="interrupt" hidden aria-label="Stop the current turn and send this now">Send now</button>
        <button type="button" id="send" class="send" aria-label="Send"></button>
      </div>
      <input type="file" id="file" multiple hidden>
    </div>
  </footer>
  <nav id="tabbar" class="tabbar" aria-label="Sections"></nav>

  <div id="drawer-bg" class="drawer-bg" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Conversations" hidden>
    <button type="button" id="new-chat" class="new-chat"></button>
    <div class="d-search"><input id="d-q" type="search" placeholder="Search chats" aria-label="Search conversations" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"><button type="button" id="d-clear" class="d-clear" aria-label="Clear search" hidden>&times;</button></div>
    <select id="d-proj" class="d-proj" aria-label="Filter by project" hidden></select>
    <div class="d-head" id="d-head"></div>
    <div class="d-list" id="d-list"></div>
    <button type="button" id="d-more" class="d-more" hidden>Show more</button>
  </aside>

  <div id="sheet-bg" class="sheet-bg" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="offline" class="offline" hidden role="alert">
    <div class="off-card">
      <span class="coin big" aria-hidden="true">Ag</span>
      <h2>Judas is not reachable</h2>
      <p id="off-msg">The server did not answer. Check that Tailscale is connected and Judas is running on the desktop.</p>
      <button type="button" id="retry" class="primary">Retry</button>
      <p class="dim" id="off-auto"></p>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script src="/theme.js"></script>
<script src="/location.js"></script>
<script src="/suggestions.js"></script>
<script src="/rich.js"></script>
<script src="/learn/learn.js"></script>
<script src="/artifact-capture.js"></script>
<script src="/cowork/cowork.js"></script>
<script src="/m/m.js"></script>
</body>
</html>
